<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cờ vua AI — Python Flask Modular Master</title>
<style>
:root{
  --bg:#07111f;--panel:rgba(15,27,45,.78);--panel2:rgba(30,41,59,.88);
  --light:#f3e5c8;--dark:#8b6848;--gold:#f7c948;--green:#35d07f;--red:#ff5d6c;
  --text:#f8fafc;--muted:#a9b8ca;--line:rgba(255,255,255,.10);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:15px 10px 25px;color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;text-align:center;
  background:radial-gradient(circle at 15% 0%,rgba(59,130,246,.20),transparent 32%),linear-gradient(145deg,#050b14,#0d1b2d 55%,#08111e);
}
h1{font-size:25px;margin:5px 0 10px}
.app{width:min(720px,100%);margin:auto}
.top,.stats{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top button,.top select{
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;
  background:var(--panel2);color:#fff;font-weight:700;cursor:pointer
}
#status{
  min-height:26px;margin:5px auto 10px;padding:6px 12px;width:fit-content;max-width:95%;
  border:1px solid var(--line);border-radius:999px;background:rgba(15,23,42,.65);font-size:13px;font-weight:700
}
.wrap{width:min(520px,100%);margin:0 auto;position:relative}
.board{
  width:100%;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);border:6px solid #172235;border-radius:14px;
  overflow:hidden;box-shadow:0 15px 45px rgba(0,0,0,.45);background:#172235;position:relative
}
.sq{position:relative;display:flex;align-items:center;justify-content:center;user-select:none;cursor:pointer;width:100%;height:100%}
.light{background:var(--light)} .dark{background:var(--dark)}
.sq.selected{box-shadow:inset 0 0 0 4px var(--gold);z-index:2}
.sq.hint:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:var(--green)}
.sq.capture:after{content:"";position:absolute;inset:5px;border:3px solid var(--red);border-radius:50%}
.sq.last{box-shadow:inset 0 0 0 3px rgba(80,170,255,.65)}
.piece{font-size:clamp(28px,7.5vw,50px);line-height:1;z-index:1}
.whitePiece{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.blackPiece{color:#111;text-shadow:0 1px 2px rgba(255,255,255,.6)}

.eval-container{width:min(520px,100%);margin:8px auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.eval-bar-bg{width:100%;height:8px;background:#1e293b;border-radius:4px;overflow:hidden;margin-top:5px}
#evalBarFill{width:50%;background:#f8fafc;transition:width 0.3s}
.stats{margin:10px auto 5px;max-width:520px}
.badge{min-width:130px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12px}
#promo{position:fixed;z-index:40;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center}
.modal{background:#101c2e;border:1px solid #40506a;border-radius:15px;padding:16px}
.promos{display:flex;gap:8px}.promos button{width:55px;height:55px;font-size:35px;background:#26364d;border-radius:10px;cursor:pointer;color:#fff}
</style>
</head>
<body>
<div class="app">
<h1>♟️ CỜ VUA AI MASTER</h1>
<div class="top">
<select id="level">
  <option value="1">Dễ</option>
  <option value="2" selected>Trung bình</option>
  <option value="3">Khó</option>
  <option value="4">Cao thủ 💀</option>
</select>
<button id="undo">↩ Undo</button>
<button id="new">🔄 Ván mới</button>
</div>

<div class="eval-container">
  <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:bold">
    <span>📊 Thế trận</span><span id="evalText">Cân bằng (0.0)</span>
  </div>
  <div class="eval-bar-bg"><div id="evalBarFill"></div></div>
</div>

<div id="status">Đang sẵn sàng...</div>
<div class="wrap"><div id="board" class="board"></div></div>

<div class="stats">
  <div class="badge">⚪ Bạn: Trắng<strong id="playerElo">ELO 1000</strong></div>
  <div class="badge">🤖 Máy: Đen<strong id="aiElo">ELO 1200</strong></div>
</div>
</div>

<div id="promo"><div class="modal"><h2>Chọn quân phong cấp</h2><div id="promos" class="promos"></div></div></div>

<script>
const ICON={P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
let board, turn, selected=null, history=[], castle, ep, pendingPromo=null, lastMove=null, gameOver=false, thinking=false;

function initialBoard(){
  return [
    ['r','n','b','q','k','b','n','r'],
    ['p','p','p','p','p','p','p','p'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['P','P','P','P','P','P','P','P'],
    ['R','N','B','Q','K','B','N','R']
  ];
}

function resetGame(){
  board = initialBoard();
  turn = 'w';
  selected = null;
  history = [];
  castle = {K:true, Q:true, k:true, q:true};
  ep = null;
  pendingPromo = null;
  lastMove = null;
  gameOver = false;
  thinking = false;
  document.getElementById('promo').style.display = 'none';
  render();
}

function clone(b){ return b.map(r => r.slice()); }

function render(){
  const el = document.getElementById('board');
  el.innerHTML = '';
  for(let r=0; r<8; r++){
    for(let c=0; c<8; c++){
      let sq = document.createElement('div');
      sq.className = 'sq ' + ((r+c)%2 ? 'dark' : 'light');
      if(selected && selected[0]===r && selected[1]===c) sq.classList.add('selected');
      if(lastMove && ((lastMove[0]===r && lastMove[1]===c) || (lastMove[2]===r && lastMove[3]===c))) sq.classList.add('last');
      
      if(board[r][c]){
        let sp = document.createElement('span');
        sp.className = 'piece ' + (board[r][c] === board[r][c].toUpperCase() ? 'whitePiece' : 'blackPiece');
        sp.textContent = ICON[board[r][c]];
        sq.appendChild(sp);
      }
      sq.onclick = () => clickSq(r, c);
      el.appendChild(sq);
    }
  }
  document.getElementById('status').textContent = thinking ? '🤖 Máy đang suy nghĩ...' : (turn === 'w' ? '⚪ Lượt của bạn' : '⚫ Lượt của máy');
}

function clickSq(r, c){
  if(gameOver || thinking || turn !== 'w') return;
  if(selected){
    if(selected[0] === r && selected[1] === c){ selected = null; render(); return; }
    // Thực hiện nước đi người chơi
    humanMove(selected[0], selected[1], r, c);
    return;
  }
  if(board[r][c] && board[r][c] === board[r][c].toUpperCase()){
    selected = [r, c];
    render();
  }
}

function humanMove(r, c, rr, cc){
  let p = board[r][c];
  if(p === 'P' && rr === 0){
    pendingPromo = {r, c, rr, cc};
    document.getElementById('promo').style.display = 'flex';
    return;
  }
  commitMove(r, c, rr, cc, null);
}

document.querySelectorAll('#promos button').forEach((btn, idx) => {
  let pieces = ['Q', 'R', 'B', 'N'];
  btn.onclick = () => {
    document.getElementById('promo').style.display = 'none';
    let x = pendingPromo;
    pendingPromo = null;
    commitMove(x.r, x.c, x.rr, x.cc, pieces[idx]);
  };
});

function commitMove(r, c, rr, cc, promo){
  history.push({board: clone(board), castle: {...castle}, ep: ep ? [...ep] : null, turn});
  let p = board[r][c];
  board[r][c] = null;
  board[rr][cc] = promo ? promo : p;
  
  lastMove = [r, c, rr, cc];
  selected = null;
  turn = 'b';
  render();

  // Gửi request lên Backend Flask để AI tính toán nước đi
  thinking = true;
  render();

  fetch('/get_ai_move', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({board, level: document.getElementById('level').value, castle, ep})
  })
  .then(res => res.json())
  .then(res => {
    thinking = false;
    if(res && res.from && res.to){
      let fr = res.from, to = res.to;
      let ap = board[fr[0]][fr[1]];
      board[fr[0]][fr[1]] = null;
      board[to[0]][to[1]] = res.promo ? res.promo : ap;
      lastMove = [fr[0], fr[1], to[0], to[1]];
    }
    turn = 'w';
    render();
  });
}

document.getElementById('new').onclick = resetGame;
document.getElementById('undo').onclick = () => {
  if(!history.length || thinking) return;
  let last = history.pop();
  board = last.board;
  castle = last.castle;
  ep = last.ep;
  turn = last.turn;
  selected = null;
  lastMove = null;
  gameOver = false;
  render();
};

resetGame();
</script>
</body>
</html>
